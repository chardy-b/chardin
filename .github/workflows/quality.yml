name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CHARDIN_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Quality and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm evidence format

      - name: Lint
        run: pnpm evidence lint

      - name: Type check
        run: pnpm evidence types

      - name: Unit and component tests with coverage
        run: pnpm evidence coverage

      - name: Production build
        run: pnpm evidence build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Ordinary production hooks boundary
        run: pnpm evidence production

      - name: Production client bundle inventory
        run: pnpm evidence bundle

      - name: Browser and visual regression tests
        run: pnpm evidence browser

      - name: Bounded desktop and mobile-emulation measurements
        run: pnpm evidence performance

      - name: Dependency vulnerability audit
        if: always()
        run: pnpm evidence audit

      - name: Upload exact-head evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-evidence-${{ env.CHARDIN_PR_HEAD }}
          path: |
            .hermes/execution/chardin/release
            coverage
            playwright-report
            test-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
