<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="720"
  viewBox="0 0 1000 720"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Original Chardin pavilion plan and local section</title>
  <desc id="desc">
    A rectangular chamber has a centered entry ramp and skewed roof opening. The
    section shows a level floor raised above a curved planet, with a continuous
    ramp and sky sightline. Dimensions and transforms are authoritative in the
    adjacent WIL-124 design.
  </desc>
  <defs>
