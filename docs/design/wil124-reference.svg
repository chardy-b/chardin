      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto-start-reverse"
    >
      <path d="M0 0 L8 4 L0 8 Z" fill="#34494b" />
    </marker>
  </defs>
  <rect width="1000" height="720" fill="#f7f4ec" />
  <g font-family="system-ui, sans-serif" fill="#263b3e">
    <text x="36" y="38" font-size="23">
      Chardin · WIL-124 construction reference
    </text>
    <text x="36" y="63" font-size="13">
      Original vector drawing · 2026-09-08 · schematic projection, not rendered
      evidence
    </text>
    <text x="36" y="101" font-size="18">Plan · local x / z</text>
    <text x="508" y="101" font-size="18">Section · local z / y (x = 0)</text>
  </g>
  <g
    transform="translate(245 293) scale(90)"
    stroke="#34494b"
    stroke-width=".015"
  >
