      fill="none"
      stroke-width=".025"
      marker-end="url(#arrow)"
    />
    <g fill="#34494b">
      <circle cx="0" cy="3.65" r=".04" />
      <circle cx="0" cy="3.25" r=".04" />
      <circle cx="0" cy="1.65" r=".04" />
      <circle cx="0" cy="1.4" r=".04" />
      <circle cx="0" cy=".5" r=".04" />
